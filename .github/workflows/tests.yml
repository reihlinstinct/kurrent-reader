name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # kraken>=5.2 has no cp314 release yet, so 3.14 cannot install here
        # (same situation as the informational 3.15 leg); 3.14 joins the
        # informational signal instead of the gate.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install CPU-only torch first
        # Full CUDA torch exhausts the runner disk (#47 follow-up); CPU wheels
        # match the Dockerfile. Pinned to kraken's torch range (>=2.9,<=2.14),
        # otherwise the editable install replaces it with full-CUDA torch.
        run: pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.9,<=2.14"
      - run: pip install -e '.[dev]' pytest
      - run: |
          if [ -d tests ]; then python -m pytest tests/ -q; else echo "no tests/ dir on this tree; skipping"; fi
      - run: python -m mypy src tests/test_ruled_table.py tests/test_train.py
  docker-smoke:
    # The README documents the Docker path; build it and smoke the CLI (issue #34).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t kurrent-reader .
      - run: docker run --rm kurrent-reader --version
