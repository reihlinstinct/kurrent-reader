name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # kraken>=5.2 has no cp314 release yet, so 3.14 cannot install here
        # (same situation as the informational 3.15 leg); 3.14 joins the
        # informational signal instead of the gate.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install hash-locked dependencies
        # Locks under requirements/ (#63, docs/DEPENDENCY-LOCKS.md). CPU-only
        # torch and torchvision come from the PyTorch CPU index (full CUDA
        # torch exhausts the runner disk, #47 follow-up), as in the Dockerfile.
        run: |
          pip install --require-hashes -r requirements/build.txt
          pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements/dev.txt
          pip install --no-deps --no-build-isolation -e ./
      - run: |
          if [ -d tests ]; then python -m pytest tests/ -q; else echo "no tests/ dir on this tree; skipping"; fi
      - run: python -m mypy src tests/test_ruled_table.py tests/test_train.py
  docker-smoke:
    # The README documents the Docker path; build it and smoke the CLI (issue #34).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t kurrent-reader .
      - run: docker run --rm kurrent-reader --version
