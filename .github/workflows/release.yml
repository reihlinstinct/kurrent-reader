name: release
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install hash-locked dependencies
        # Locks under requirements/ (#63, docs/DEPENDENCY-LOCKS.md).
        run: |
          pip install --require-hashes -r requirements/build.txt
          pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements/dev.txt
          pip install --no-deps --no-build-isolation -e ./
      - run: |
          if [ -d tests ]; then python -m pytest tests/ -q; else echo "no tests/ dir on this tree; skipping"; fi
  release:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: |
          git config user.name "reihlinstinct"
          git config user.email "reihlinstinct@gmail.com"
      - run: python scripts/release.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
